name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/passes
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --lib
