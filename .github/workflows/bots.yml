name: Demo trader bots

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run one bot tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRIVUE_URL: ${{ vars.PRIVUE_URL || 'https://privue.vercel.app' }}
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$PRIVUE_URL/api/cron/tick"
